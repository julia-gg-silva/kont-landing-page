<section class="-mt-[5rem]">
    <div>
        <h1 class="reveal text-[17rem] font-semibold font-stara text-[#777676]">CONTATO</h1>
    </div>
    <div class="-mt-[5rem] grid grid-cols-2 gap-[5rem] ml-[7.5rem] mr-[5rem]">
        <div class="flex flex-col gap-10">
            <h2 class="reveal delay-200 text-5xl text-[#FFFF] font-stara font-semibold">Bora fazer sua marca se
                movimentar do jeito
                certo?</h2>
            <p class="reveal delay-300 text-white/90 text-2xl">
                Deixa seus dados aqui, e<br> marcamos
                <span class="italic underline underline-offset-2 decoration-1 decoration-[#F1F1F1]">
                    um café!
                </span>
            </p>
            <div class="reveal delay-400 flex flex-row gap-2 mt-[5rem]">
                <div>
                    <img src="/src/assets/image/icones/redes/Ativo 8.png" alt="Logo WhatsApp"
                        class="w-[1.5rem] h-[1.5rem]">
                </div>
                <div>
                    <img src="/src/assets/image/icones/redes/Ativo 9.png" alt="Logo Instagram"
                        class="w-[1.5rem] h-[1.5rem]">
                </div>
                <div>
                    <img src="/src/assets/image/icones/redes/Ativo 10.png" alt="Logo Facebook"
                        class="w-[1.5rem] h-[1.5rem]">
                </div>
                <div>
                    <img src="/src/assets/image/icones/redes/Ativo 11.png" alt="Logo Linkedin"
                        class="w-[1.5rem] h-[1.5rem]">
                </div>
                <div>
                    <img src="/src/assets/image/icones/redes/Ativo 12.png" alt="Logo Rede social"
                        class="w-[1.5rem] h-[1.5rem]">
                </div>
            </div>
        </div>

        <div>
            <form id="contact-form" class="reveal delay-400 flex flex-col gap-8 max-w-[32rem] text-[#FFFF]">

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">Nome</label>
                    <input type="text" name="name" id="from_name" required
                        class="w-full bg-transparent border-b border-white text-white placeholder-white/50 focus:outline-none pb-2" />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">Número</label>
                    <input type="tel" name="phone" id="user_phone" required
                        class="w-full bg-transparent border-b border-white text-white focus:outline-none pb-2"
                        inputmode="numeric" oninput="
                        let v = this.value.replace(/\D/g,'').slice(0,11);
                        let r = '';
                        if (v.length >= 1) r = '(' + v.slice(0,2);
                        if (v.length >= 3) r += ') ' + v.slice(2,7);
                        if (v.length >= 8) r += '-' + v.slice(7,11);
                        this.value = r;
                    " />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">E-mail</label>
                    <input type="email" name="email" id="user_email" required
                        class="w-full bg-transparent border-b border-white text-white placeholder-white/50 focus:outline-none pb-2" />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">Quer saber mais? Fala com a gente!</label>
                    <textarea rows="4" name="message" id="user_message" required
                        class="w-full bg-transparent border-b border-white text-white placeholder-white/50 resize-none focus:outline-none"></textarea>
                </div>

                <button type="submit" id="btn-submit"
                    class="text-sm rounded-2xl bg-white px-8 py-2 text-black w-fit hover:bg-zinc-800 hover:text-white transition-all duration-300 mt-4">
                    Enviar
                </button>
            </form>
        </div>
    </div>
</section>

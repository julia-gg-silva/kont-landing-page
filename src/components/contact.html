<section class="-mt-[5rem]">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-[5rem] mx-6 md:ml-[7.5rem] md:mr-[5rem]">
        
        <div class="flex flex-col gap-10">
            <h2 class="reveal delay-200 text-3xl md:text-5xl text-[#FFFF] font-stara font-semibold">

                </a>

                </a>
                <a href="https://designersolange1.myportfolio.com/" target="_blank" class="hover:opacity-70 transition-opacity">

                </a>
            </div>
        </div>

        <div>
            <form id="contact-form" class="reveal delay-400 flex flex-col gap-8 max-w-full md:max-w-[32rem] text-[#FFFF]">

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">Nome</label>
                    <input type="text" name="name" id="from_name" required
                        class="w-full bg-transparent border-b border-white text-white placeholder-white/50 focus:outline-none pb-2" />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">Número</label>
                    <input type="tel" name="phone" id="user_phone" required
                        class="w-full bg-transparent border-b border-white text-white focus:outline-none pb-2"
                        inputmode="numeric" oninput="
                        let v = this.value.replace(/\D/g,'').slice(0,11);
                        let r = '';
                        if (v.length >= 1) r = '(' + v.slice(0,2);
                        if (v.length >= 3) r += ') ' + v.slice(2,7);
                        if (v.length >= 8) r += '-' + v.slice(7,11);
                        this.value = r;
                    " />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">E-mail</label>
                    <input type="email" name="email" id="user_email" required
                        class="w-full bg-transparent border-b border-white text-white placeholder-white/50 focus:outline-none pb-2" />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-white/60 text-sm tracking-wide">Quer saber mais? Fala com a gente!</label>
                    <textarea rows="4" name="message" id="user_message" required
                        class="w-full bg-transparent border-b border-white text-white placeholder-white/50 resize-none focus:outline-none"></textarea>
                </div>

                <button type="submit" id="btn-submit"
                    class="text-sm rounded-2xl bg-white px-8 py-2 text-black w-full md:w-fit hover:bg-zinc-800 hover:text-white transition-all duration-300 mt-4">
                    Enviar
                </button>
            </form>

            <div class="flex md:hidden flex-row justify-center gap-8 mt-16 pb-10">
                <a href="https://wa.me/5547991146481?text=Ol%C3%A1..." target="_blank">

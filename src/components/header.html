<header class="relative z-[100]">
    <div class="bg-white p-5 mx-6 md:mx-20 my-8 flex justify-between items-center rounded-full shadow-lg">
        <a href="#hero" class="flex items-center">
            <img src="/src/assets/image/logo/KONT PRETO.png" alt="Logo preta KONT" class="h-6 w-auto md:pl-5" />
        </a>

        <nav class="hidden md:block">
            <ul class="flex flex-row gap-10 lg:gap-20 pr-5 text-xl font-stara font-semibold text-black">
                <li><a href="#about" class="hover:opacity-60 transition">Quem somos</a></li>
                <li><a href="#services" class="hover:opacity-60 transition">Serviços</a></li>
                <li><a href="#contact" class="hover:opacity-60 transition">Contato</a></li>
            </ul>
        </nav>

        <button id="menu-btn" class="md:hidden flex flex-col gap-1.5 pr-4 outline-none">
            <span class="w-6 h-0.5 bg-black transition-all duration-300 origin-left" id="line1"></span>

        <nav>
            <ul class="flex flex-col gap-8 text-2xl font-stara font-semibold text-black">
                <li><a href="#about" class="mobile-link">Quem somos</a></li>
                <li><a href="#services" class="mobile-link">Serviços</a></li>
                <li><a href="#contact" class="mobile-link">Contato</a></li>

        </nav>
        
        <div class="mt-auto">

    </div>

    <div id="overlay" class="fixed inset-0 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-500 z-[105] md:hidden"></div>
</header>
